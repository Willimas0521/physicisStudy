                q: "近地卫星（轨道半径 R）、同步卫星（轨道半径 6.6R）、赤道上的物体，三者中向心加速度最大的是？",
                opts: [
                    "近地卫星",
                    "同步卫星",
                    "赤道物体",
                    "一样大"
                ],
                answer: 0,
                explain: "近地卫星向心加速度 $a = \\dfrac{GM}{R^2} = g$；同步卫星 $a = \\dfrac{GM}{(6.6R)^2} \\approx \\dfrac{g}{43.6}$；赤道物体 $a = \\omega^2R \\approx 0.034\\ \\text{m/s}^2 \\ll g$。故近地卫星最大。"
            },
            {
                exam: true,
                q: "（高考真题 · 复合考点）地球赤道上的物体随地球自转的向心加速度为 a₁，同步卫星的向心加速度为 a₂，第一宇宙速度对应的近地卫星向心加速度为 a₃。则 a₁、a₂、a₃ 的大小关系是？",
                opts: [
                    "a₁ = a₂ = a₃",
                    "a₁ > a₂ > a₃",
                    "a₃ > a₂ > a₁",
                    "a₂ > a₃ > a₁"
                ],
                answer: 2,
                explain: "a₁ 与 a₂：角速度相同（同步），$a = \\omega^2r$，r₂ > R，故 a₂ > a₁。a₂ 与 a₃：$a = \\dfrac{GM}{r^2}$，r₃ = R < r₂ = 6.6R，故 a₃ > a₂。综上 a₃ > a₂ > a₁。",
                points: [
                    { step: "赤道物体与同步卫星角速度相同，a = ω²r 比较 a₂ > a₁", k: "sync" },
                    { step: "近地卫星与同步卫星用 a = GM/r² 比较 a₃ > a₂", k: "satellite" },
                    { step: "近地卫星 a₃ = GM/R² = g 为最大", k: "golden" },
                    { step: "综合三段比较得出 a₃ > a₂ > a₁", k: "satellite" }
                ]
            },
            {
                exam: true,
                q: "（压轴题 · 复合考点）飞船在半径为 R₁ 的轨道上绕地球做圆周运动，周期为 T₁。变轨后在半径 R₂ = 2R₁ 的轨道上运行。则新轨道周期 T₂ 与 T₁ 的关系为？",
                opts: [
                    "T₂ = 2T₁",
                    "T₂ = 2√2 T₁",
                    "T₂ = 4T₁",
                    "T₂ = 8T₁"
                ],
                answer: 1,
                explain: "由开普勒第三定律（圆轨道）：$\\dfrac{R_1^3}{T_1^2} = \\dfrac{R_2^3}{T_2^2}$，$T_2 = T_1\\left(\\dfrac{R_2}{R_1}\\right)^{3/2} = T_1 \\times 2^{3/2} = 2\\sqrt{2}\\,T_1$。",
                points: [
                    { step: "识别圆轨道运动，可用开普勒第三定律（或 GM 相等）", k: "kepler" },
                    { step: "列式 R₁³/T₁² = R₂³/T₂²", k: "kepler" },
                    { step: "代入 R₂ = 2R₁ 解出 T₂ = 2√2·T₁", k: "satellite" }
                ]
            }
        ]
    }
];;

/* ============ 渲染与交互 ============ */
const container = document.getElementById('container');
const levelNav = document.getElementById('levelNav');
const LEVEL_COUNT = LEVELS.length;
let total = 0;
LEVELS.forEach(lv => { total += (lv.challenges || [lv.challenge]).length; });
let score = 0;
let done = 0;
let current = 0;
let answered = {};

document.getElementById('totalVal').textContent = total;

LEVELS.forEach((lv, i) => {
    const navBtn = document.createElement('button');
    navBtn.innerHTML = `<span class="nav-no">考点${String(i+1).padStart(2,'0')}</span><span class="nav-name">${lv.title}</span>`;
    navBtn.onclick = () => goTo(i);
    levelNav.appendChild(navBtn);

    const sec = document.createElement('div');
    sec.className = 'level' + (i === 0 ? ' active' : '');
    sec.id = 'lv' + i;

    let html = `
        <div class="level-head">
            <span class="level-badge">${lv.badge}</span>
            <h2>${lv.title}</h2>
        </div>
        <p class="level-intro">${lv.intro}</p>
    `;

    lv.formulas.forEach(f => {
        const isMath = f.f.indexOf('$') !== -1;
        const isTable = /^\s*<table/i.test(f.f);
        html += `
        <div class="formula-box">
            <div class="ftitle">📘 ${f.t}</div>
            ${isMath
                ? `<div class="formula">${f.f}</div>`
                : (isTable ? `<div class="formula-html">${f.f}</div>` : `<div class="formula-text">${f.f}</div>`)}
            <div class="formula-note">${f.note}</div>
        </div>`;
    });

    (lv.figs || []).forEach(g => {
        html += `
        <figure class="figbox">
            <img src="${g.src}" alt="${g.cap}">
            <figcaption>🖼 ${g.cap}</figcaption>
        </figure>`;
    });

    const exs = lv.examples || (lv.example ? [lv.example] : []);
    exs.forEach((ex, ei) => {
        html += `<div class="example">
        <div class="q">💡 例题${exs.length > 1 ? ' ' + (ei + 1) : ''}</div>`;
        if (ex.q) html += `<div class="eq">${ex.q}</div>`;
        ex.steps.forEach(s => { html += `<div class="step">${s}</div>`; });
        html += `</div>`;
    });

    const chs = lv.challenges || [lv.challenge];
    chs.forEach((c, k) => {
        const cid = i + '_' + k;
        let ctag = c.exam ? `<span class="ctag" style="background:#8e44ad;">🏆 高考真题</span>` : `<span class="ctag">🎮 闯关挑战</span>`;
        if (Array.isArray(c.answer)) ctag += `<span class="ctag" style="background:#00897b;margin-left:8px;">☑ 多选题（可多选）</span>`;
        html += `
        <div class="challenge">
            ${ctag}
            <div class="cq">${c.q}</div>
            <div class="opts" id="opts${cid}">`;
        c.opts.forEach((o, j) => {
            html += `<div class="opt" data-i="${cid}" data-j="${j}"><span class="key">${String.fromCharCode(65+j)}</span><span>${o}</span></div>`;
        });
        html += `</div>
            <button class="cbtn" id="btn${cid}">提交答案</button>
            <div class="cresult" id="res${cid}"></div>
            <div class="cexplain" id="exp${cid}"><b>📝 解析：</b>${c.explain}</div>
        </div>
        `;
    if (c.exam && c.points) {
        const ids = c.points.map(p => p.k);
        const mods = new Set(ids.map(id => KNOW[id] && KNOW[id].module));
        const lvs = new Set(ids.map(id => KNOW[id] && KNOW[id].lv));
        const isCompound = mods.size > 1 || lvs.size > 1;
        const badge = isCompound
            ? `<span style="background:#e67e22;color:#fff;font-size:0.78em;padding:2px 10px;border-radius:10px;margin-left:8px;">⚡ 复合考点（跨 ${mods.size} 模块 / ${lvs.size} 考点）</span>`
            : '';
        html += `
        <div class="cexplain" id="trace${cid}" style="background:#f3e5f5; border-left:4px solid #8e44ad;">
            <b>🔍 知识点溯源${badge}（哪一步用到了哪个知识点）：</b>
            <table class="trace-table">
                <tr><th>解题步骤</th><th>用到的知识点</th><th>所属模块·关卡</th><th>若这步卡住 → 去哪复习</th></tr>`;
        c.points.forEach(p => {
            const k = KNOW[p.k];
            if (k) {
                html += `<tr>
                    <td>${p.step}</td>
                    <td><b>${k.name}</b><br><span style="color:#7b4b9e;font-size:0.85em;">${k.desc}</span></td>
                    <td>${k.module} · <a href="javascript:void(0)" onclick="goTo(${k.lv})" class="lvlink">考点${String(k.lv+1).padStart(2,'0')}</a></td>
                    <td style="color:#c0392b;">回到「${k.name}」</td>
                </tr>`;
            } else {
                html += `<tr><td>${p.step}</td><td colspan="3" style="color:#c0392b;">⚠ 知识点 id「${p.k}」未在库中定义</td></tr>`;
            }
        });
        html += `</table>
            <p style="margin-top:8px; color:#6a1b9a; font-size:0.92em;">💡 复合考点做错时，对照上表找到第一个没想通的环节，点击「第X关」直接跳去复习对应知识点，精准补缺。</p>
        </div>`;
    }
    });

    html += `<div class="keymemo">🔑 <b>本关记忆要点：</b>${lv.title} — 熟记上方公式，理解例题思路，再做题巩固。</div>`;

    html += `<div class="level-actions">
        <button class="btn" id="prev${i}" ${i===0?'disabled':''} onclick="goTo(${i-1})">← 上一关</button>
        <span id="status${i}"></span>
        <button class="btn btn-next" id="next${i}" ${i===LEVEL_COUNT-1?'disabled':''} onclick="goTo(${i+1})">下一关 →</button>
    </div>`;

    sec.innerHTML = html;
    container.appendChild(sec);
});

function isMulti(cid) {
    const [li, lk] = cid.split('_').map(Number);
    const chs = LEVELS[li].challenges || [LEVELS[li].challenge];
    return Array.isArray(chs[lk].answer);
}

document.querySelectorAll('.opt').forEach(opt => {
    opt.addEventListener('click', function() {
        const cid = this.dataset.i;
        if (answered[cid]) return;
        if (!isMulti(cid)) {
            document.querySelectorAll(`.opt[data-i="${cid}"]`).forEach(o => { o.classList.remove('selected'); o.style.borderColor=''; o.style.background=''; });
        }
        if (this.classList.contains('selected')) {
            this.classList.remove('selected');
            this.style.borderColor = '';
            this.style.background = '';
        } else {
            this.classList.add('selected');
            this.style.borderColor = '#3a7bd5';
            this.style.background = '#eef4ff';
        }
    });
});

document.querySelectorAll('.cbtn').forEach(btn => {
    btn.addEventListener('click', function() {
        const cid = this.id.replace('btn', '');
        submitAnswer(cid);
    });
});

function submitAnswer(cid) {
    if (answered[cid]) return;
    const sel = document.querySelectorAll(`.opt[data-i="${cid}"].selected`);
    if (!sel.length) { alert('请先选择一个答案！（多选题可点选多个）'); return; }
    const picked = Array.from(sel).map(o => +o.dataset.j).sort((a, b) => a - b);
    answered[cid] = true;
    const opts = document.querySelectorAll(`.opt[data-i="${cid}"]`);
    opts.forEach(o => { o.classList.add('disabled'); o.style.borderColor=''; o.style.background=''; });
    const [li, lk] = cid.split('_').map(Number);
    const chs = LEVELS[li].challenges || [LEVELS[li].challenge];
    const correct = chs[lk].answer;
    const rightSet = (Array.isArray(correct) ? correct.slice() : [correct]).sort((a, b) => a - b);
    rightSet.forEach(i => opts[i].classList.add('correct'));
    const res = document.getElementById('res' + cid);
    const exp = document.getElementById('exp' + cid);
    exp.classList.add('show');
    const trace = document.getElementById('trace' + cid);
    if (trace) trace.classList.add('show');

    const ok = picked.length === rightSet.length && picked.every((v, i) => v === rightSet[i]);
    if (ok) {
        score++;
        res.className = 'cresult ok';
        res.textContent = '✅ 回答正确！+1 分';
    } else {
        picked.forEach(i => { if (rightSet.indexOf(i) === -1) opts[i].classList.add('wrong'); });
        res.className = 'cresult no';
        res.textContent = '❌ 回答错误，正确答案：' + rightSet.map(i => String.fromCharCode(65 + i)).join('、');
    }
    done++;
    updateLevelStatus(li);
    updateProgress();
}

function updateLevelStatus(li) {
    const chs = LEVELS[li].challenges || [LEVELS[li].challenge];
    const allAnswered = chs.every((_, k) => answered[li + '_' + k]);
    if (allAnswered) {
        levelNav.children[li].classList.add('done');
        const allRight = chs.every((c, k) => {
            const key = li + '_' + k;
            if (!answered[key]) return false;
            const right = Array.isArray(c.answer) ? c.answer : [c.answer];
            return right.every(a => document.querySelector(`.opt[data-i="${key}"][data-j="${a}"]`)?.classList.contains('correct'));
        });
        document.getElementById('status' + li).textContent = allRight ? '✅ 已通关' : '❌ 本关未通过';
    }
}

function updateProgress() {
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('doneVal').textContent = done;
    document.getElementById('progFill').style.width = (done/total*100) + '%';
    if (done === total) {
        setTimeout(showModal, 400);
    }
}

function goTo(i) {
    if (i < 0 || i >= LEVEL_COUNT) return;
    document.getElementById('lv' + current).classList.remove('active');
    levelNav.children[current].classList.remove('active');
    current = i;
    document.getElementById('lv' + i).classList.add('active');
    levelNav.children[i].classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

levelNav.children[0].classList.add('active');

function showModal() {
    const stars = score >= total*0.9 ? '⭐⭐⭐' : (score >= total*0.6 ? '⭐⭐' : '⭐');
    document.getElementById('modalStars').textContent = stars;
    document.getElementById('modalScore').textContent = `最终得分：${score} / ${total}`;
    document.getElementById('overlay').classList.add('show');
}
</script>

<script src="../nav.js"></script>
</body>
</html>
