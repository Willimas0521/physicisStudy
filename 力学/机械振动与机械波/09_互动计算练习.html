<body>
<div class="header">
<h1>🌊 机械振动与机械波</h1>
<p>互动计算练习</p>
</div>
<div class="container">
<div class="card-nav" style="margin-bottom:18px;"><a href="index.html" style="color:#3a7bd5;text-decoration:none;font-weight:600;">← 返回目录</a></div>

<div class="card" id="calc">
    <h2><span class="num">8</span>互动计算练习</h2>
    <p>输入数值，验证你学到的公式！</p>

    <div class="interactive">
        <h3>① 单摆周期 $T = 2\pi\sqrt{L/g}$</h3>
        <label>摆长 L (m): <input type="number" id="L1" value="1"></label>
        <label>g (m/s²): <input type="number" id="g1" value="9.8"></label>
        <br><button onclick="calcPendulum()">计算周期</button>
        <div class="result" id="pendulumResult"></div>
    </div>

    <div class="interactive">
        <h3>② 波速 $v = \lambda f$</h3>
        <label>波长 λ (m): <input type="number" id="lam2" value="0.773"></label>
        <label>频率 f (Hz): <input type="number" id="f2" value="440"></label>
        <br><button onclick="calcWave()">计算波速</button>
        <div class="result" id="waveResult"></div>
    </div>

    <div class="interactive">
        <h3>③ 简谐运动总能量 $E = \tfrac12 k A^2$</h3>
        <label>劲度系数 k (N/m): <input type="number" id="k3" value="100"></label>
        <label>振幅 A (m): <input type="number" id="A3" value="0.1"></label>
        <br><button onclick="calcEnergy()">计算总能量</button>
        <div class="result" id="energyResult"></div>
    </div>

    <div class="interactive">
        <h3>④ 测重力加速度 $g = 4\pi^2 L/T^2$</h3>
        <label>摆长 L (m): <input type="number" id="L4" value="1"></label>
        <label>周期 T (s): <input type="number" id="T4" value="2.01"></label>
        <br><button onclick="calcG()">计算 g</button>
        <div class="result" id="gResult"></div>
    </div>
</div>


</div>
<div class="footer">
<p>📖 高中物理 · 机械振动与机械波</p>
</div>
<script>
<script>
function calcPendulum() {
    const L = parseFloat(document.getElementById('L1').value);
    const g = parseFloat(document.getElementById('g1').value);
    if (isNaN(L) || isNaN(g) || L <= 0) { alert('请输入有效数值'); return; }
    const T = 2 * Math.PI * Math.sqrt(L / g);
    const div = document.getElementById('pendulumResult');
    div.style.display = 'block';
    div.innerHTML = `T = 2π√(L/g) = 2π√(${L}/${g}) = <b>${T.toFixed(3)} s</b>`;
}

function calcWave() {
    const lam = parseFloat(document.getElementById('lam2').value);
    const f = parseFloat(document.getElementById('f2').value);
    if (isNaN(lam) || isNaN(f)) { alert('请输入有效数值'); return; }
    const v = lam * f;
    const div = document.getElementById('waveResult');
    div.style.display = 'block';
    div.innerHTML = `v = λf = ${lam} × ${f} = <b>${v.toFixed(2)} m/s</b>`;
}

function calcEnergy() {
    const k = parseFloat(document.getElementById('k3').value);
    const A = parseFloat(document.getElementById('A3').value);
    if (isNaN(k) || isNaN(A)) { alert('请输入有效数值'); return; }
    const E = 0.5 * k * A * A;
    const div = document.getElementById('energyResult');
    div.style.display = 'block';
    div.innerHTML = `E = ½kA² = ½ × ${k} × ${A}² = <b>${E.toFixed(3)} J</b>`;
}

function calcG() {
    const L = parseFloat(document.getElementById('L4').value);
    const T = parseFloat(document.getElementById('T4').value);
    if (isNaN(L) || isNaN(T) || T <= 0) { alert('请输入有效数值'); return; }
    const g = 4 * Math.PI * Math.PI * L / (T * T);
    const div = document.getElementById('gResult');
    div.style.display = 'block';
    div.innerHTML = `g = 4π²L/T² = 4π² × ${L} / ${T}² ≈ <b>${g.toFixed(2)} m/s²</b>`;
}
function toggle(id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('show');
}
</script>
</body>
