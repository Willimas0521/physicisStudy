/* ========== 渲染 ========== */
var app = document.getElementById('app');
var html = '';
GROUPS.forEach(function (grp) {
    html += '<section class="group" style="--c:' + grp.c + '">';
    html += '<h2><span class="dot"></span>' + grp.g + '<span class="n">' + grp.items.length + ' 页</span></h2>';
    html += '<div class="links">';
    grp.items.forEach(function (it) {
        html += '<a class="lk" style="--c:' + grp.c + '" href="' + encodeURI(it.h) + '"'
              + ' data-k="' + (grp.g + ' ' + it.n + ' ' + (it.d || '')).toLowerCase() + '">'
              + '<span class="ic">' + (it.i || '📄') + '</span>'
              + '<span class="nm">' + it.n + '</span>'
              + (it.d ? '<span class="ds">' + it.d + '</span>' : '')
              + '</a>';
    });
    html += '</div></section>';
});
app.innerHTML = html;

var total = GROUPS.reduce(function (s, g) { return s + g.items.length; }, 0);
document.getElementById('total').textContent = total;

/* ========== 搜索过滤 ========== */
var q = document.getElementById('q');
var empty = document.getElementById('empty');
var links = Array.prototype.slice.call(document.querySelectorAll('.lk'));
var groups = Array.prototype.slice.call(document.querySelectorAll('.group'));
function filter() {
    var kw = (q.value || '').trim().toLowerCase();
    var shown = 0;
    links.forEach(function (a) {
        var hit = !kw || a.getAttribute('data-k').indexOf(kw) > -1;
        a.classList.toggle('hide', !hit);
    });
    groups.forEach(function (s) {
        var any = s.querySelector('.lk:not(.hide)');
        s.classList.toggle('hide', !any);
        if (any) shown++;
    });
    empty.style.display = shown ? 'none' : 'block';
}
q.addEventListener('input', filter);
q.addEventListener('keydown', function (e) { if (e.key === 'Escape') { q.value = ''; filter(); } });
