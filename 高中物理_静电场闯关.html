        /* 公式区 */
        .formula-box {
            background: linear-gradient(135deg, #f0f4f8, #e8f0fa);
            border: 1px solid #d6e2ef; border-left: 5px solid #3a7bd5;

        .formula-box .ftitle { font-weight: 700; color: #1e3c72; font-size: 1.05em; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }

        .opts { display: grid; gap: 10px; margin-bottom: 12px; }
        .opt {
            background: #fff; border: 2px solid #e0e0e0; border-radius: 8px;

        .opt.correct .key { background: #4caf50; color: white; }
        .opt.wrong { border-color: #e53935; background: #ffebee; }
        .opt.wrong .key { background: #e53935; color: white; }
        .opt.disabled { pointer-events: none; }
        .challenge .cbtn {
            background: #ff6a00; color: white; border: none; padding: 8px 22px;
            border-radius: 8px; cursor: pointer; font-size: 0.98em; font-weight: 600;
        }
        .challenge .cbtn:hover { background: #e65100; }
        .challenge .cexplain {
            margin-top: 14px; padding: 14px 18px; background: #e3f2fd;
            border-left: 4px solid #2196f3; border-radius: 6px; color: #0d47a1;
            display: none; font-size: 0.97em;
        }
        .challenge .cexplain.show { display: block; }
        .trace-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.9em; }
        .trace-table th { background: #f3e5f5; color: #6a1b9a; padding: 8px 12px; text-align: left; border-bottom: 2px solid #ce93d8; }
        .trace-table td { padding: 8px 12px; border-bottom: 1px solid #e1bee7; vertical-align: top; color: #4a235a; }
        .trace-table tr:hover { background: #faf0fb; }
        .lvlink { color: #8e44ad; font-weight: 700; text-decoration: underline; cursor: pointer; }
        .challenge .cresult { margin-top: 12px; font-weight: 700; font-size: 1.05em; display: none; }
        .challenge .cresult.ok { color: #2e7d32; display: block; }
        .challenge .cresult.no { color: #e53935; display: block; }

        .keymemo {
            background: linear-gradient(90deg, #e3f2fd, #f5f9ff);
            border-left: 4px solid #2196f3; padding: 12px 18px; margin: 16px 0; border-radius: 6px;
        }
        .keymemo b { color: #1565c0; }

        .level-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; gap: 12px; flex-wrap: wrap; }
        .btn {
            background: #3a7bd5; color: white; border: none; padding: 11px 26px;
            border-radius: 8px; cursor: pointer; font-size: 1em; font-weight: 600; transition: 0.2s;
        }
        .btn:hover { background: #2a5298; }
        .btn:disabled { background: #b0bec5; cursor: not-allowed; }
        .btn-next { background: linear-gradient(135deg, #ff6a00, #ee0979); }
        .btn-next:hover { opacity: 0.9; }

        /* 通关弹窗 */
        .overlay {
            position: fixed; inset: 0; background: rgba(30,60,114,0.85);
            display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px;
        }
        .overlay.show { display: flex; }
        .modal {
            background: white; border-radius: 18px; padding: 40px 36px; max-width: 460px; width: 100%;
            text-align: center; box-shadow: 0 10px 50px rgba(0,0,0,0.4); animation: pop 0.4s ease;

        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal .big { font-size: 3.4em; margin-bottom: 10px; }
        .modal h2 { color: #1e3c72; font-size: 1.7em; margin-bottom: 12px; }
        .modal p { color: #5a6b7b; margin-bottom: 8px; }
        .modal .stars { font-size: 1.8em; margin: 14px 0; letter-spacing: 4px; }
        .modal .btn { margin-top: 18px; }

        .footer { text-align: center; padding: 30px; color: #7f8c8d; font-size: 0.9em; border-top: 1px solid #e0e6ed; margin-top: 20px; }

        @media (max-width: 1100px) {
            .container { margin-left: auto !important; }
            .side-nav {
                position: sticky; top: 96px; left: auto; right: auto;
                width: auto; max-width: 1040px; margin: 0 auto 20px;
                max-height: none; overflow: visible;
                display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            }
            .side-nav .side-title { margin: 0 6px 0 0; padding: 0; border: none; }
            .level-nav { flex-direction: row; flex-wrap: wrap; flex: 1; }
            .level-nav button { width: auto; flex: 1; min-width: 108px; }
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.7em; }
            .level { padding: 22px; }
            .level h2 { font-size: 1.35em; }
            .side-nav { top: 88px; padding: 10px; }
        }
    </style>
</head>

<div class="header">
    <h1>⚡ 高考物理 · 静电场闯关</h1>
    <p>库仑定律 · 电场强度 · 电势与电势差 · 电容器 · 带电粒子运动 — 公式 → 例题 → 闯关答题</p>

<script>
/* ============ 全局知识点库（支持复合考点跨关引用） ============ */
/* lv: 所属关卡序号(0起)  module: 所属模块 */
const KNOW = {
    "coulomb":   { name: "库仑定律 F = kq₁q₂/r²", lv: 0, module: "库仑定律", desc: "真空中点电荷间的静电力，方向沿连线，同号相斥异号相吸" },
    "charge":    { name: "电荷守恒定律", lv: 0, module: "库仑定律", desc: "起电过程电荷总量守恒，不创生不消灭" },
    "efield":    { name: "电场强度 E = F/q", lv: 1, module: "电场强度", desc: "描述电场强弱与方向的矢量，由电场本身决定，与检验电荷无关" },
    "efield-point": { name: "点电荷场强 E = kQ/r²", lv: 1, module: "电场强度", desc: "正电荷场强背离 +Q，负电荷场强指向 -Q" },
    "superpos":  { name: "场强叠加原理", lv: 1, module: "电场强度", desc: "合场强等于各场强的矢量和（平行四边形定则）" },
    "fieldline": { name: "电场线", lv: 2, module: "电场线", desc: "疏密表强弱、切线表方向、不相交、起正止负不闭合" },
    "ep":        { name: "电势能 Ep = qφ", lv: 3, module: "电势与电势能", desc: "电场力做正功电势能减小，做负功电势能增大" },
    "potential": { name: "电势 φ = Ep/q", lv: 3, module: "电势与电势能", desc: "标量有正负，沿电场线方向电势降低" },
    "work":      { name: "电场力做功 W = qU", lv: 4, module: "电场力做功", desc: "电场力做功与路径无关，只与初末位置电势差有关" },
    "voltage":   { name: "电势差 UAB = φA - φB", lv: 4, module: "电场力做功", desc: "电势差与零势点选取无关，是绝对量" },
    "UEd":       { name: "匀强电场 U = Ed", lv: 5, module: "电势差与场强", desc: "沿场强方向的距离，d 为两点沿场强方向的投影距离" },
    "equipot":   { name: "等势面", lv: 5, module: "电势差与场强", desc: "等势面上各点电势相等，等势面与电场线垂直" },
    "cap":       { name: "电容器 C = Q/U", lv: 6, module: "电容器", desc: "电容描述电容器容纳电荷的本领，由本身结构决定" },
    "pcap":      { name: "平行板 C = εS/4πkd", lv: 6, module: "电容器", desc: "与正对面积、介电常数成正比，与板间距成反比" },
    "static":    { name: "静电平衡", lv: 6, module: "静电平衡", desc: "内部场强处处为零，导体为等势体，表面为等势面" },
    "acc":       { name: "电场加速 qU = ½mv²", lv: 7, module: "带电粒子运动", desc: "静电力做功等于动能变化，常用于直线加速" },
    "deflect":   { name: "电场偏转（类平抛）", lv: 7, module: "带电粒子运动", desc: "垂直电场入射做类平抛，分解为匀速 + 匀加速" }
};

/* ============ 关卡数据 ============ */
const LEVELS = [
    {
        badge: "库仑定律 · 考点01",
        title: "库仑定律",
        intro: "静电力是电荷间的基本相互作用，一切电场问题都从这里出发。",
        formulas: [
            { t: "📐 库仑定律", f: "$$F = k\\dfrac{q_1q_2}{r^2}$$", note: "单位 N；k = 9×10⁹ N·m²/C²（静电力常量）。适用于真空中点电荷。" },
            { t: "🔍 方向判断", f: "<span class='term-chip good'>同号相斥</span><span class='term-op'>/</span><span class='term-chip warn'>异号相吸</span><span class='term-op'>→</span><span class='term-chip'>沿连线方向</span>", note: "库仑力方向始终在两点电荷的连线上。" },
            { t: "🔋 电荷守恒", f: "$$q_1 + q_2 + \\cdots = \\text{常量}$$", note: "摩擦起电、接触起电、感应起电都不创造也不消灭电荷，只是电荷的转移。" }
        ],
        example: {
            q: "真空中两个点电荷，电荷量分别为 2×10⁻⁸ C 和 4×10⁻⁸ C，相距 0.2 m，求它们之间的静电力大小。",
            steps: [
                "由库仑定律：$F = k\\dfrac{q_1q_2}{r^2} = 9\\times10^9 \\times \\dfrac{2\\times10^{-8}\\times4\\times10^{-8}}{0.2^2}$",
                "$F = 9\\times10^9 \\times \\dfrac{8\\times10^{-16}}{4\\times10^{-2}} = 9\\times10^9 \\times 2\\times10^{-14}$",
                "$F = 1.8\\times10^{-4}\\ \\text{N}$"
            ]
        },
        challenges: [
            {
                q: "两个带电量均为 q 的点电荷相距 r，库仑力大小为 F。若两电荷的电荷量均变为 2q、距离变为 2r，库仑力大小为？",
                opts: ["F/4", "F/2", "F", "4F"],
                answer: 2,
                explain: "$F' = k\\dfrac{(2q)(2q)}{(2r)^2} = k\\dfrac{4q^2}{4r^2} = F$，距离加倍与电荷量都加倍恰好抵消。"
            },
            {
                q: "关于库仑定律，下列说法正确的是？",
                opts: [
                    "库仑定律适用于任意两个带电体",
                    "库仑力的方向一定在两点电荷的连线上",
                    "只有电荷量很小的电荷才能被看成点电荷",
                    "库仑力与万有引力是同一种力"

/* ============ 渲染与交互 ============ */
const container = document.getElementById('container');
const levelNav = document.getElementById('levelNav');
const LEVEL_COUNT = LEVELS.length;
// 总题数 = 所有关卡 challenges 数量之和
let total = 0;
LEVELS.forEach(lv => { total += (lv.challenges || [lv.challenge]).length; });
let score = 0;
let done = 0;
let current = 0;
let answered = {};

document.getElementById('totalVal').textContent = total;

LEVELS.forEach((lv, i) => {
    // 导航按钮（考点编号 + 标题）
    const navBtn = document.createElement('button');
    navBtn.innerHTML = `<span class="nav-no">考点${String(i+1).padStart(2,'0')}</span><span class="nav-name">${lv.title}</span>`;
    navBtn.onclick = () => goTo(i);
    levelNav.appendChild(navBtn);

    // 关卡卡片
    const sec = document.createElement('div');
    sec.className = 'level' + (i === 0 ? ' active' : '');
    sec.id = 'lv' + i;

    let html = `
        <div class="level-head">
            <span class="level-badge">${lv.badge}</span>
            <h2>${lv.title}</h2>
        </div>
        <p class="level-intro">${lv.intro}</p>
    `;

    // 公式区（含 $ 的走 MathJax，纯概念文本用标签卡片样式）
    lv.formulas.forEach(f => {
        const isMath = f.f.indexOf('$') !== -1;
        html += `
        <div class="formula-box">
            <div class="ftitle">📘 ${f.t}</div>
            ${isMath
                ? `<div class="formula">${f.f}</div>`
                : `<div class="formula-text">${f.f}</div>`}
            <div class="formula-note">${f.note}</div>
        </div>`;
    });

    // 例题
    html += `<div class="example">
        <div class="q">💡 例题</div>`;
    lv.example.steps.forEach(s => { html += `<div class="step">${s}</div>`; });
    html += `</div>`;

    // 闯关答题（支持多题）
    const chs = lv.challenges || [lv.challenge];
    chs.forEach((c, k) => {
        const cid = i + '_' + k;
        const ctag = c.exam ? `<span class="ctag" style="background:#8e44ad;">🏆 高考真题</span>` : `<span class="ctag">🎮 闯关挑战</span>`;
        html += `
        <div class="challenge">
            ${ctag}
            <div class="cq">${c.q}</div>
            <div class="opts" id="opts${cid}">`;
        c.opts.forEach((o, j) => {
            html += `<div class="opt" data-i="${cid}" data-j="${j}"><span class="key">${String.fromCharCode(65+j)}</span><span>${o}</span></div>`;
        });
        html += `</div>
            <button class="cbtn" id="btn${cid}">提交答案</button>
            <div class="cresult" id="res${cid}"></div>
            <div class="cexplain" id="exp${cid}"><b>📝 解析：</b>${c.explain}</div>
        </div>
        `;
    // 真题知识点溯源（支持复合考点：跨关/跨模块引用全局知识点库）
    if (c.exam && c.points) {
        const ids = c.points.map(p => p.k);
        const mods = new Set(ids.map(id => KNOW[id] && KNOW[id].module));
        const lvs = new Set(ids.map(id => KNOW[id] && KNOW[id].lv));
        const isCompound = mods.size > 1 || lvs.size > 1;
        const badge = isCompound
            ? `<span style="background:#e67e22;color:#fff;font-size:0.78em;padding:2px 10px;border-radius:10px;margin-left:8px;">⚡ 复合考点（跨 ${mods.size} 模块 / ${lvs.size} 考点）</span>`
            : '';
        html += `
        <div class="cexplain" id="trace${cid}" style="background:#f3e5f5; border-left:4px solid #8e44ad;">
            <b>🔍 知识点溯源${badge}（哪一步用到了哪个知识点）：</b>
            <table class="trace-table">
                <tr><th>解题步骤</th><th>用到的知识点</th><th>所属模块·关卡</th><th>若这步卡住 → 去哪复习</th></tr>`;
        c.points.forEach(p => {
            const k = KNOW[p.k];
            if (k) {
                html += `<tr>
                    <td>${p.step}</td>
                    <td><b>${k.name}</b><br><span style="color:#7b4b9e;font-size:0.85em;">${k.desc}</span></td>
                    <td>${k.module} · <a href="javascript:void(0)" onclick="goTo(${k.lv})" class="lvlink">考点${String(k.lv+1).padStart(2,'0')}</a></td>
                    <td style="color:#c0392b;">回到「${k.name}」</td>
                </tr>`;
            } else {
                html += `<tr><td>${p.step}</td><td colspan="3" style="color:#c0392b;">⚠ 知识点 id「${p.k}」未在库中定义</td></tr>`;
            }
        });
        html += `</table>
            <p style="margin-top:8px; color:#6a1b9a; font-size:0.92em;">💡 复合考点做错时，对照上表找到第一个没想通的环节，点击「第X关」直接跳去复习对应知识点，精准补缺。</p>
        </div>`;
    }
    });

    // 记忆要点
    html += `<div class="keymemo">🔑 <b>本关记忆要点：</b>${lv.title} — 熟记上方公式，理解例题思路，再做题巩固。</div>`;

    // 关卡切换按钮
    html += `<div class="level-actions">
        <button class="btn" id="prev${i}" ${i===0?'disabled':''} onclick="goTo(${i-1})">← 上一关</button>
        <span id="status${i}"></span>
        <button class="btn btn-next" id="next${i}" ${i===LEVEL_COUNT-1?'disabled':''} onclick="goTo(${i+1})">下一关 →</button>
    </div>`;

    sec.innerHTML = html;
    container.appendChild(sec);
});

// 动态插入的公式统一交给 MathJax 排版
if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise();
}

// 选项点击
document.querySelectorAll('.opt').forEach(opt => {
    opt.addEventListener('click', function() {
        const cid = this.dataset.i;
        if (answered[cid]) return;
        // 取消同组选中
        document.querySelectorAll(`.opt[data-i="${cid}"]`).forEach(o => { o.classList.remove('selected'); o.style.borderColor=''; o.style.background=''; });
        this.classList.add('selected');
        this.style.borderColor = '#3a7bd5';
        this.style.background = '#eef4ff';
    });
});

// 为每道题绑定提交
document.querySelectorAll('.cbtn').forEach(btn => {
    btn.addEventListener('click', function() {
        const cid = this.id.replace('btn', '');
        submitAnswer(cid);
    });
});

function submitAnswer(cid) {
    if (answered[cid]) return;
    const sel = document.querySelector(`.opt[data-i="${cid}"].selected`);
    if (!sel) { alert('请先选择一个答案！'); return; }
    const j = +sel.dataset.j;
    answered[cid] = true;
    const opts = document.querySelectorAll(`.opt[data-i="${cid}"]`);
    opts.forEach(o => { o.classList.add('disabled'); o.style.borderColor=''; o.style.background=''; });
    // 找到该题所属关卡与挑战数据
    const [li, lk] = cid.split('_').map(Number);
    const chs = LEVELS[li].challenges || [LEVELS[li].challenge];
    const correct = chs[lk].answer;
    opts[correct].classList.add('correct');
    const res = document.getElementById('res' + cid);
    const exp = document.getElementById('exp' + cid);
    exp.classList.add('show');
    const trace = document.getElementById('trace' + cid);
    if (trace) trace.classList.add('show');

    if (j === correct) {
        score++;
        res.className = 'cresult ok';
        res.textContent = '✅ 回答正确！+1 分';
    } else {
        opts[j].classList.add('wrong');
        res.className = 'cresult no';
        res.textContent = '❌ 回答错误，正确答案：' + String.fromCharCode(65+correct);
    }
    done++;
    updateLevelStatus(li);
    updateProgress();
}

// 根据关卡内所有题的作答情况更新关卡状态
function updateLevelStatus(li) {
    const chs = LEVELS[li].challenges || [LEVELS[li].challenge];
    const allAnswered = chs.every((_, k) => answered[li + '_' + k]);
    if (allAnswered) {
        levelNav.children[li].classList.add('done');
        const allRight = chs.every((c, k) => answered[li+'_'+k] && document.querySelector(`.opt[data-i="${li}_${k}"][data-j="${c.answer}"]`)?.classList.contains('correct'));
        document.getElementById('status' + li).textContent = allRight ? '✅ 已通关' : '❌ 本关未通过';
    }
}

function updateProgress() {
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('doneVal').textContent = done;
    document.getElementById('progFill').style.width = (done/total*100) + '%';
    if (done === total) {
        setTimeout(showModal, 400);
    }
}

function goTo(i) {
    if (i < 0 || i >= LEVEL_COUNT) return;
    document.getElementById('lv' + current).classList.remove('active');
    levelNav.children[current].classList.remove('active');
    current = i;
    document.getElementById('lv' + i).classList.add('active');
    levelNav.children[i].classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 初始高亮导航
levelNav.children[0].classList.add('active');

function showModal() {
    const stars = score >= total*0.9 ? '⭐⭐⭐' : (score >= total*0.6 ? '⭐⭐' : '⭐');
    document.getElementById('modalStars').textContent = stars;
    document.getElementById('modalScore').textContent = `最终得分：${score} / ${total}`;
    document.getElementById('overlay').classList.add('show');
}
</script>

<script src="nav.js"></script>
</body>
</html>
